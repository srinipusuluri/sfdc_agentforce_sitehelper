<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Five steps in order. Claude in Chrome creates the Slack app and enables the webhook. You approve and allow it. You copy the URL and paste it into the Salesforce label. Claude in Chrome saves the label. Claude Code sends a test message and schedules the digest.">
<rect width="1000" height="300" fill="#f6f8f8"/>
        <defs><marker id="s4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17232a"/></marker></defs>
        <g font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12" fill="#17232a" stroke="#17232a">
          <rect x="0" y="5" width="1000" height="85" fill="#fbeedb" stroke="none" opacity=".6"/>
          <rect x="0" y="100" width="1000" height="85" fill="#dff1ef" stroke="none" opacity=".6"/>
          <rect x="0" y="195" width="1000" height="85" fill="#e1f3e8" stroke="none" opacity=".6"/>
          <text x="10" y="22" stroke="none" font-size="11" letter-spacing="1" fill="#58696f">YOU</text>
          <text x="10" y="117" stroke="none" font-size="11" letter-spacing="1" fill="#58696f">CHROME</text>
          <text x="10" y="212" stroke="none" font-size="11" letter-spacing="1" fill="#58696f">CODE</text>

          <rect x="120" y="115" width="170" height="60" rx="8" fill="#ffffff"/>
          <text x="205" y="139" text-anchor="middle" stroke="none">1 Create app,</text><text x="205" y="156" text-anchor="middle" stroke="none">enable webhook</text>
          <rect x="310" y="25" width="170" height="60" rx="8" fill="#ffffff"/>
          <text x="395" y="49" text-anchor="middle" stroke="none">2 Say yes, click Allow</text><text x="395" y="66" text-anchor="middle" stroke="none" font-size="11" fill="#58696f">choose the channel</text>
          <rect x="500" y="25" width="190" height="60" rx="8" fill="#ffffff" stroke-width="2"/>
          <text x="595" y="49" text-anchor="middle" stroke="none">3 Copy the URL, paste</text><text x="595" y="66" text-anchor="middle" stroke="none">into the label yourself</text>
          <rect x="710" y="115" width="140" height="60" rx="8" fill="#ffffff"/>
          <text x="780" y="139" text-anchor="middle" stroke="none">4 Save the</text><text x="780" y="156" text-anchor="middle" stroke="none">label</text>
          <rect x="810" y="210" width="180" height="60" rx="8" fill="#ffffff"/>
          <text x="900" y="234" text-anchor="middle" stroke="none">5 Test message,</text><text x="900" y="251" text-anchor="middle" stroke="none">schedule digest</text>

          <g fill="none" stroke-width="1.5">
            <path d="M290 145 H300 V55 H308" marker-end="url(#s4)"/>
            <line x1="480" y1="55" x2="498" y2="55" marker-end="url(#s4)"/>
            <path d="M690 55 H700 V145 H708" marker-end="url(#s4)"/>
            <path d="M850 145 H870 V208" marker-end="url(#s4)"/>
          </g>
        </g>
      </svg>
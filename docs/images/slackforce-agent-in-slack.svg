<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="1000" height="200" role="img" aria-label="A person in Slack messages the agent through the Salesforce and Slack integration. The Case Triage Assistant runs its Apex actions on Case records and the reply returns to Slack.">
<rect width="1000" height="200" fill="#f6f8f8"/>
        <defs><marker id="s3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17232a"/></marker></defs>
        <g font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12.5" fill="#17232a" stroke="#17232a">
          <rect x="10" y="60" width="130" height="70" rx="8" fill="#ffffff" stroke-dasharray="5 3"/>
          <text x="75" y="90" text-anchor="middle" stroke="none">Person in Slack</text><text x="75" y="108" text-anchor="middle" stroke="none" font-size="11" fill="#58696f">asks about cases</text>
          <rect x="180" y="60" width="170" height="70" rx="8" fill="#ffffff" stroke-dasharray="5 3"/>
          <text x="265" y="88" text-anchor="middle" stroke="none">Slack and Salesforce</text><text x="265" y="106" text-anchor="middle" stroke="none">integration</text>
          <rect x="390" y="60" width="170" height="70" rx="8" fill="#dff1ef" stroke="#0b7a75" stroke-width="2"/>
          <text x="475" y="88" text-anchor="middle" stroke="none" font-weight="600">Case Triage</text><text x="475" y="106" text-anchor="middle" stroke="none" font-weight="600">Assistant</text>
          <rect x="600" y="60" width="150" height="70" rx="8" fill="#ffffff"/>
          <text x="675" y="88" text-anchor="middle" stroke="none">Apex actions</text><text x="675" y="106" text-anchor="middle" stroke="none" font-size="11" fill="#58696f">list · set priority</text>
          <rect x="790" y="60" width="130" height="70" rx="8" fill="#ffffff"/>
          <text x="855" y="100" text-anchor="middle" stroke="none">Case records</text>
          <g fill="none" stroke-width="1.5">
            <line x1="140" y1="95" x2="178" y2="95" marker-end="url(#s3)"/>
            <line x1="350" y1="95" x2="388" y2="95" marker-end="url(#s3)"/>
            <line x1="560" y1="95" x2="598" y2="95" marker-end="url(#s3)"/>
            <line x1="750" y1="95" x2="788" y2="95" marker-end="url(#s3)"/>
            <path d="M475 132 V168 H75 V132" stroke-dasharray="5 3" marker-end="url(#s3)"/>
          </g>
          <text x="275" y="184" text-anchor="middle" stroke="none" font-size="11" fill="#58696f">reply returns to the Slack conversation</text>
        </g>
      </svg>
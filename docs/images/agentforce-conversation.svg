<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-label="Visitor message goes to the router. General questions are answered, demo requests go to follow-up capture, unrelated requests are declined, and requests for a person or frustration go to escalation, which transfers to the queue where a human accepts.">
<rect width="1000" height="250" fill="#f6f8f8"/>
        <defs><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17232a"/></marker></defs>
        <g font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12.5" fill="#17232a" stroke="#17232a">
          <rect x="10" y="95" width="120" height="60" rx="8" fill="#ffffff"/>
          <text x="70" y="121" text-anchor="middle" stroke="none">Visitor sends</text><text x="70" y="138" text-anchor="middle" stroke="none">a message</text>
          <rect x="175" y="95" width="130" height="60" rx="8" fill="#dff1ef" stroke="#0b7a75" stroke-width="2"/>
          <text x="240" y="121" text-anchor="middle" stroke="none">Agent Router</text><text x="240" y="138" text-anchor="middle" stroke="none" font-size="11" fill="#58696f">classifies intent</text>

          <rect x="470" y="8" width="170" height="50" rx="8" fill="#e1f3e8" stroke="#1f7a45"/>
          <text x="555" y="29" text-anchor="middle" stroke="none">General Info</text><text x="555" y="46" text-anchor="middle" stroke="none" font-size="11" fill="#58696f">answers, chat can end</text>
          <rect x="470" y="70" width="170" height="50" rx="8" fill="#e1f3e8" stroke="#1f7a45"/>
          <text x="555" y="91" text-anchor="middle" stroke="none">Follow-Up Capture</text><text x="555" y="108" text-anchor="middle" stroke="none" font-size="11" fill="#58696f">demo or callback by email</text>
          <rect x="470" y="132" width="170" height="50" rx="8" fill="#ffffff"/>
          <text x="555" y="153" text-anchor="middle" stroke="none">Off Topic</text><text x="555" y="170" text-anchor="middle" stroke="none" font-size="11" fill="#58696f">declines, redirects</text>
          <rect x="470" y="194" width="170" height="50" rx="8" fill="#fbeedb" stroke="#b45309" stroke-width="2"/>
          <text x="555" y="215" text-anchor="middle" stroke="none">Escalation</text><text x="555" y="232" text-anchor="middle" stroke="none" font-size="11" fill="#58696f">asks for a person, frustrated</text>

          <rect x="700" y="194" width="130" height="50" rx="8" fill="#fbeedb" stroke="#b45309"/>
          <text x="765" y="215" text-anchor="middle" stroke="none">Queue</text><text x="765" y="232" text-anchor="middle" stroke="none" font-size="11" fill="#58696f">Omni-Channel routes</text>
          <rect x="860" y="194" width="130" height="50" rx="8" fill="#fbeedb" stroke="#b45309" stroke-width="2"/>
          <text x="925" y="215" text-anchor="middle" stroke="none">Human accepts</text><text x="925" y="232" text-anchor="middle" stroke="none" font-size="11" fill="#58696f">in Service Console</text>

          <g fill="none" stroke-width="1.5">
            <line x1="130" y1="125" x2="173" y2="125" marker-end="url(#a2)"/>
            <path d="M305 125 H380 V33 H468" marker-end="url(#a2)"/>
            <path d="M305 125 H380 V95 H468" marker-end="url(#a2)"/>
            <path d="M305 125 H380 V157 H468" marker-end="url(#a2)"/>
            <path d="M305 125 H380 V219 H468" marker-end="url(#a2)" stroke="#b45309" stroke-width="2"/>
            <line x1="640" y1="219" x2="698" y2="219" marker-end="url(#a2)" stroke="#b45309" stroke-width="2"/>
            <line x1="830" y1="219" x2="858" y2="219" marker-end="url(#a2)" stroke="#b45309" stroke-width="2"/>
          </g>
          <g stroke="none" font-size="10.5" fill="#58696f">
            <text x="388" y="28">company, product questions</text>
            <text x="388" y="90">wants a demo</text>
            <text x="388" y="152">unrelated</text>
            <text x="388" y="214">person / frustration</text>
          </g>
        </g>
      </svg>
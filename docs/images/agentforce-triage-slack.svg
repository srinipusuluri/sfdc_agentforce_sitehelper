<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-label="Staff talk to Case Triage Assistant, which calls Apex actions on Case records. A Case insert with High priority fires a trigger, and a daily job, both call SlackCaseNotifier, which posts to a Slack webhook.">
<rect width="1000" height="330" fill="#f6f8f8"/>
        <defs><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17232a"/></marker></defs>
        <g font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12.5" fill="#17232a" stroke="#17232a">
          <rect x="10" y="40" width="100" height="70" rx="8" fill="#ffffff"/><text x="60" y="80" text-anchor="middle" stroke="none">Support staff</text>
          <rect x="140" y="40" width="150" height="70" rx="8" fill="#dff1ef" stroke="#0b7a75" stroke-width="2"/>
          <text x="215" y="68" text-anchor="middle" stroke="none" font-weight="600">Case Triage</text><text x="215" y="86" text-anchor="middle" stroke="none" font-weight="600">Assistant</text>
          <rect x="320" y="40" width="140" height="70" rx="8" fill="#ffffff"/>
          <text x="390" y="68" text-anchor="middle" stroke="none">Apex actions</text><text x="390" y="86" text-anchor="middle" stroke="none" font-size="11" fill="#58696f">list · set priority</text>
          <rect x="490" y="40" width="130" height="70" rx="8" fill="#ffffff"/>
          <text x="555" y="80" text-anchor="middle" stroke="none">Case records</text>

          <rect x="490" y="170" width="130" height="60" rx="8" fill="#fbeedb" stroke="#b45309"/>
          <text x="555" y="196" text-anchor="middle" stroke="none">Trigger</text><text x="555" y="214" text-anchor="middle" stroke="none" font-size="10.5" fill="#58696f">after insert, High</text>
          <rect x="650" y="150" width="150" height="100" rx="8" fill="#ffffff" stroke-width="2"/>
          <text x="725" y="188" text-anchor="middle" stroke="none" font-weight="600">SlackCaseNotifier</text>
          <text x="725" y="208" text-anchor="middle" stroke="none" font-size="11" fill="#58696f">future callout</text>
          <text x="725" y="224" text-anchor="middle" stroke="none" font-size="11" fill="#58696f">skips if unset</text>
          <rect x="650" y="275" width="150" height="45" rx="8" fill="#ffffff"/>
          <text x="725" y="302" text-anchor="middle" stroke="none">Daily digest job</text>
          <rect x="840" y="170" width="150" height="60" rx="8" fill="#ffffff" stroke-dasharray="5 3"/>
          <text x="915" y="196" text-anchor="middle" stroke="none">Slack webhook</text><text x="915" y="214" text-anchor="middle" stroke="none" font-size="10.5" fill="#58696f">to set</text>

          <g fill="none" stroke-width="1.5">
            <line x1="110" y1="75" x2="138" y2="75" marker-end="url(#a3)"/>
            <line x1="290" y1="75" x2="318" y2="75" marker-end="url(#a3)"/>
            <line x1="460" y1="75" x2="488" y2="75" marker-end="url(#a3)"/>
            <line x1="555" y1="110" x2="555" y2="168" marker-end="url(#a3)"/>
            <line x1="620" y1="200" x2="648" y2="200" marker-end="url(#a3)"/>
            <line x1="725" y1="275" x2="725" y2="252" marker-end="url(#a3)"/>
            <line x1="800" y1="200" x2="838" y2="200" marker-end="url(#a3)"/>
          </g>
        </g>
      </svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img" aria-label="Map of the five agents. A website visitor reaches Site Helper through the embedded chat and kb-answer through a site LWC. Support staff reach Case Triage Assistant in a chat and case-summary through a record-page LWC. A new High priority Case starts case-triage through a background job. Each agent touches different data.">
<rect width="1000" height="440" fill="#f6f8f8"/>
<defs>
<marker id="g1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0b7a75"/></marker>
<marker id="g2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3b5b8c"/></marker>
</defs>
<g font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12.5" fill="#17232a" stroke="#17232a">
<text x="10" y="16" stroke="none" font-size="11" letter-spacing="1" fill="#58696f">WHO</text>
<text x="215" y="16" stroke="none" font-size="11" letter-spacing="1" fill="#58696f">ENTRY POINT</text>
<text x="470" y="16" stroke="none" font-size="11" letter-spacing="1" fill="#58696f">AGENT</text>
<text x="760" y="16" stroke="none" font-size="11" letter-spacing="1" fill="#58696f">WHAT IT TOUCHES</text>
<rect x="10" y="34" width="170" height="56" rx="8" fill="#ffffff"/><text x="95" y="59" text-anchor="middle" stroke="none" font-weight="600">Website visitor</text><text x="95" y="76" text-anchor="middle" stroke="none" font-size="10.5" fill="#58696f">types a question</text>
<line x1="180" y1="62" x2="213" y2="62" stroke="#0b7a75" stroke-width="2" marker-end="url(#g1)"/>
<rect x="215" y="34" width="205" height="56" rx="8" fill="#ffffff"/><text x="317" y="67" text-anchor="middle" stroke="none">Embedded chat on the site</text>
<line x1="420" y1="62" x2="468" y2="62" stroke="#0b7a75" stroke-width="2" marker-end="url(#g1)"/>
<rect x="470" y="34" width="235" height="56" rx="8" fill="#dff1ef" stroke="#0b7a75" stroke-width="2"/><text x="587" y="59" text-anchor="middle" stroke="none" font-weight="600" fill="#0b7a75">Site Helper</text><text x="587" y="76" text-anchor="middle" stroke="none" font-size="10.5" fill="#58696f">Agentforce</text>
<line x1="705" y1="62" x2="758" y2="62" stroke="#0b7a75" stroke-width="2" marker-end="url(#g1)"/>
<rect x="760" y="34" width="230" height="56" rx="8" fill="#ffffff"/><text x="875" y="59" text-anchor="middle" stroke="none">Omni-Channel queue on escalation</text><text x="875" y="76" text-anchor="middle" stroke="none" font-size="10.5" fill="#58696f">No Salesforce records</text>
<rect x="10" y="106" width="170" height="56" rx="8" fill="#ffffff"/><text x="95" y="131" text-anchor="middle" stroke="none" font-weight="600">Website visitor</text><text x="95" y="148" text-anchor="middle" stroke="none" font-size="10.5" fill="#58696f">asks on a public page</text>
<line x1="180" y1="134" x2="213" y2="134" stroke="#3b5b8c" stroke-width="2" marker-end="url(#g2)"/>
<rect x="215" y="106" width="205" height="56" rx="8" fill="#ffffff"/><text x="317" y="139" text-anchor="middle" stroke="none">Site LWC, through Apex</text>
<line x1="420" y1="134" x2="468" y2="134" stroke="#3b5b8c" stroke-width="2" marker-end="url(#g2)"/>
<rect x="470" y="106" width="235" height="56" rx="8" fill="#e3eaf5" stroke="#3b5b8c" stroke-width="2"/><text x="587" y="131" text-anchor="middle" stroke="none" font-weight="600" fill="#3b5b8c">kb-answer</text><text x="587" y="148" text-anchor="middle" stroke="none" font-size="10.5" fill="#58696f">Claude agent on AWS</text>
<line x1="705" y1="134" x2="758" y2="134" stroke="#3b5b8c" stroke-width="2" marker-end="url(#g2)"/>
<rect x="760" y="106" width="230" height="56" rx="8" fill="#ffffff"/><text x="875" y="131" text-anchor="middle" stroke="none">Published public Knowledge</text><text x="875" y="148" text-anchor="middle" stroke="none" font-size="10.5" fill="#58696f">read only</text>
<rect x="10" y="178" width="170" height="56" rx="8" fill="#ffffff"/><text x="95" y="203" text-anchor="middle" stroke="none" font-weight="600">Support staff</text><text x="95" y="220" text-anchor="middle" stroke="none" font-size="10.5" fill="#58696f">asks about cases</text>
<line x1="180" y1="206" x2="213" y2="206" stroke="#0b7a75" stroke-width="2" marker-end="url(#g1)"/>
<rect x="215" y="178" width="205" height="56" rx="8" fill="#ffffff"/><text x="317" y="211" text-anchor="middle" stroke="none">Case Triage chat</text>
<line x1="420" y1="206" x2="468" y2="206" stroke="#0b7a75" stroke-width="2" marker-end="url(#g1)"/>
<rect x="470" y="178" width="235" height="56" rx="8" fill="#dff1ef" stroke="#0b7a75" stroke-width="2"/><text x="587" y="203" text-anchor="middle" stroke="none" font-weight="600" fill="#0b7a75">Case Triage Assistant</text><text x="587" y="220" text-anchor="middle" stroke="none" font-size="10.5" fill="#58696f">Agentforce</text>
<line x1="705" y1="206" x2="758" y2="206" stroke="#0b7a75" stroke-width="2" marker-end="url(#g1)"/>
<rect x="760" y="178" width="230" height="56" rx="8" fill="#ffffff"/><text x="875" y="203" text-anchor="middle" stroke="none">Cases</text><text x="875" y="220" text-anchor="middle" stroke="none" font-size="10.5" fill="#58696f">read, change priority</text>
<rect x="10" y="250" width="170" height="56" rx="8" fill="#ffffff"/><text x="95" y="275" text-anchor="middle" stroke="none" font-weight="600">Support staff</text><text x="95" y="292" text-anchor="middle" stroke="none" font-size="10.5" fill="#58696f">opens a Case</text>
<line x1="180" y1="278" x2="213" y2="278" stroke="#3b5b8c" stroke-width="2" marker-end="url(#g2)"/>
<rect x="215" y="250" width="205" height="56" rx="8" fill="#ffffff"/><text x="317" y="283" text-anchor="middle" stroke="none">Record-page LWC, through Apex</text>
<line x1="420" y1="278" x2="468" y2="278" stroke="#3b5b8c" stroke-width="2" marker-end="url(#g2)"/>
<rect x="470" y="250" width="235" height="56" rx="8" fill="#e3eaf5" stroke="#3b5b8c" stroke-width="2"/><text x="587" y="275" text-anchor="middle" stroke="none" font-weight="600" fill="#3b5b8c">case-summary</text><text x="587" y="292" text-anchor="middle" stroke="none" font-size="10.5" fill="#58696f">Claude agent on AWS</text>
<line x1="705" y1="278" x2="758" y2="278" stroke="#3b5b8c" stroke-width="2" marker-end="url(#g2)"/>
<rect x="760" y="250" width="230" height="56" rx="8" fill="#ffffff"/><text x="875" y="275" text-anchor="middle" stroke="none">One Case and its comments</text><text x="875" y="292" text-anchor="middle" stroke="none" font-size="10.5" fill="#58696f">read only</text>
<rect x="10" y="322" width="170" height="56" rx="8" fill="#ffffff"/><text x="95" y="347" text-anchor="middle" stroke="none" font-weight="600">A new High priority Case</text><text x="95" y="364" text-anchor="middle" stroke="none" font-size="10.5" fill="#58696f"></text>
<line x1="180" y1="350" x2="213" y2="350" stroke="#3b5b8c" stroke-width="2" marker-end="url(#g2)"/>
<rect x="215" y="322" width="205" height="56" rx="8" fill="#ffffff"/><text x="317" y="355" text-anchor="middle" stroke="none">Case trigger and job (example)</text>
<line x1="420" y1="350" x2="468" y2="350" stroke="#3b5b8c" stroke-width="2" marker-end="url(#g2)"/>
<rect x="470" y="322" width="235" height="56" rx="8" fill="#e3eaf5" stroke="#3b5b8c" stroke-width="2"/><text x="587" y="347" text-anchor="middle" stroke="none" font-weight="600" fill="#3b5b8c">case-triage</text><text x="587" y="364" text-anchor="middle" stroke="none" font-size="10.5" fill="#58696f">Claude agent on AWS</text>
<line x1="705" y1="350" x2="758" y2="350" stroke="#3b5b8c" stroke-width="2" marker-end="url(#g2)"/>
<rect x="760" y="322" width="230" height="56" rx="8" fill="#ffffff"/><text x="875" y="347" text-anchor="middle" stroke="none">One Case</text><text x="875" y="364" text-anchor="middle" stroke="none" font-size="10.5" fill="#58696f">read, add internal comment</text>

<rect x="10" y="395" width="14" height="14" rx="3" fill="#dff1ef" stroke="#0b7a75"/><text x="30" y="407" stroke="none" font-size="11.5">Agentforce, runs in Salesforce</text>
<rect x="250" y="395" width="14" height="14" rx="3" fill="#e3eaf5" stroke="#3b5b8c"/><text x="270" y="407" stroke="none" font-size="11.5">Claude agent, runs on AWS</text>
</g></svg>
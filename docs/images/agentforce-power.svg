<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Each visitor message goes to the planner, which chooses a topic and an action. The action runs against Salesforce data or a flow, the Einstein Trust Layer checks the model traffic, and the reply goes back to the visitor, or the planner escalates to a human through Omni-Channel.">
<rect width="1000" height="300" fill="#f6f8f8"/>
        <defs>
          <marker id="p1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#17232a"/></marker>
          <marker id="p2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b45309"/></marker>
        </defs>
        <g font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12.5" fill="#17232a" stroke="#17232a">
          <rect x="10" y="100" width="120" height="70" rx="8" fill="#ffffff"/>
          <text x="70" y="130" text-anchor="middle" stroke="none">Visitor or</text><text x="70" y="148" text-anchor="middle" stroke="none">staff message</text>

          <rect x="170" y="85" width="180" height="100" rx="8" fill="#dff1ef" stroke="#0b7a75" stroke-width="2"/>
          <text x="260" y="112" text-anchor="middle" stroke="none" font-weight="600">Planner</text>
          <text x="260" y="132" text-anchor="middle" stroke="none" font-size="11" fill="#58696f">reads the message, picks a</text>
          <text x="260" y="148" text-anchor="middle" stroke="none" font-size="11" fill="#58696f">topic, decides the next step</text>
          <text x="260" y="168" text-anchor="middle" stroke="none" font-size="11" fill="#58696f">script rules + model reasoning</text>

          <rect x="400" y="20" width="190" height="52" rx="8" fill="#ffffff"/>
          <text x="495" y="42" text-anchor="middle" stroke="none">Apex action</text><text x="495" y="59" text-anchor="middle" stroke="none" font-size="11" fill="#58696f">list cases, set priority</text>
          <rect x="400" y="84" width="190" height="52" rx="8" fill="#ffffff"/>
          <text x="495" y="106" text-anchor="middle" stroke="none">Flow or prompt template</text><text x="495" y="123" text-anchor="middle" stroke="none" font-size="11" fill="#58696f">available, not used here</text>
          <rect x="400" y="148" width="190" height="52" rx="8" fill="#ffffff"/>
          <text x="495" y="170" text-anchor="middle" stroke="none">Knowledge or data library</text><text x="495" y="187" text-anchor="middle" stroke="none" font-size="11" fill="#58696f">grounded answers, not yet wired</text>
          <rect x="400" y="212" width="190" height="52" rx="8" fill="#fbeedb" stroke="#b45309" stroke-width="2"/>
          <text x="495" y="234" text-anchor="middle" stroke="none">Escalate</text><text x="495" y="251" text-anchor="middle" stroke="none" font-size="11" fill="#58696f">to Omni-Channel queue</text>

          <rect x="640" y="85" width="160" height="100" rx="8" fill="#ffffff" stroke-dasharray="5 3"/>
          <text x="720" y="115" text-anchor="middle" stroke="none" font-weight="600">Einstein Trust Layer</text>
          <text x="720" y="136" text-anchor="middle" stroke="none" font-size="11" fill="#58696f">sits between the agent</text>
          <text x="720" y="152" text-anchor="middle" stroke="none" font-size="11" fill="#58696f">and the language model:</text>
          <text x="720" y="168" text-anchor="middle" stroke="none" font-size="11" fill="#58696f">masking, safety checks</text>

          <rect x="850" y="100" width="140" height="70" rx="8" fill="#ffffff"/>
          <text x="920" y="130" text-anchor="middle" stroke="none">Reply in the</text><text x="920" y="148" text-anchor="middle" stroke="none">same chat</text>

          <g fill="none" stroke-width="1.5">
            <line x1="130" y1="135" x2="168" y2="135" marker-end="url(#p1)"/>
            <path d="M350 120 H375 V46 H398" marker-end="url(#p1)"/>
            <path d="M350 135 H398" marker-end="url(#p1)"/>
            <path d="M350 150 H375 V174 H398" marker-end="url(#p1)"/>
            <path d="M350 170 H365 V238 H398" marker-end="url(#p2)" stroke="#b45309" stroke-width="2"/>
            <path d="M590 46 H615 V120 H638" marker-end="url(#p1)"/>
            <path d="M590 110 H638" marker-end="url(#p1)"/>
            <path d="M590 174 H615 V150 H638" marker-end="url(#p1)"/>
            <line x1="800" y1="135" x2="848" y2="135" marker-end="url(#p1)"/>
          </g>
        </g>
      </svg>